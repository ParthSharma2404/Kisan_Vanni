<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kisan-Vaani | AI Buddy Voice Agri-Intelligence</title>
  <meta name="description" content="Clean, simple, aesthetic voice assistant powered by Gnani AI. Mandi rates, crop advice, and eNAM rights.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="ai-buddy-body">
  <!-- Topographic Contour Header Background -->
  <div class="topo-lines-bg">
    <svg viewBox="0 0 400 120" preserveAspectRatio="none" class="topo-svg">
      <path d="M-50,20 C50,5 150,35 250,15 C350,-5 450,25 500,10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>
      <path d="M-50,40 C60,25 160,50 260,30 C360,10 460,45 500,25" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.2"/>
      <path d="M-50,60 C70,45 170,70 270,45 C370,25 470,60 500,40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2"/>
      <path d="M-50,80 C80,65 180,90 280,60 C380,40 480,75 500,55" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.2"/>
    </svg>
  </div>

  <div class="app-viewport">
    <!-- Top Bar: Pill Tag & Online Indicator -->
    <header class="top-nav-bar">
      <div class="top-meta-left"></div>

      <div class="top-center-brand">
        <div class="ai-buddy-pill">
          <span class="pill-title">AI Buddy</span>
        </div>
        <div class="ai-buddy-status">
          <span class="status-pulse-dot" id="globalStatusDot"></span>
          <span id="activeFarmerSubtext">Online</span>
        </div>
      </div>

      <div class="top-meta-right">
        <div class="phone-chip" id="topPhoneBadge" style="display: none;">
          <span id="topPhoneText">+91 Mobile</span>
        </div>
      </div>
    </header>

    <!-- Center Stage: 3D Iridescent Fluid Sphere & Dynamic Subtitles -->
    <main class="voice-center-stage" id="voiceStage">
      <!-- 3D Holographic Fluid Sphere -->
      <div class="sphere-wrapper" id="orbContainer">
        <div class="sphere-ambient-backlight"></div>
        <div class="iridescent-sphere" id="voiceOrb">
          <div class="sphere-glass-layer"></div>
          <div class="fluid-swirl-indigo"></div>
          <div class="fluid-swirl-cyan"></div>
          <div class="fluid-swirl-magenta"></div>
          <div class="fluid-swirl-peach"></div>
          <div class="sphere-gloss-glare"></div>
          <div class="sphere-caustic-edge"></div>
        </div>
      </div>

      <!-- State Subtitle / Indicator -->
      <div class="voice-state-pill" id="voiceStatePill" style="display: none;">
        <span class="state-dot" id="stateDot"></span>
        <span id="voiceStateText">Listening</span>
      </div>

      <!-- Large Center-Lower Clean Typography Display -->
      <div class="voice-caption-wrapper">
        <p class="voice-caption" id="voiceCaption">
          "Namaste Kisan Bhai, aaj kaunsi fasal ka taaza bhav dekhna chahte hain?"
        </p>
      </div>

      <!-- Floating WhatsApp Toast Notification -->
      <div class="wa-floating-toast" id="waFloatingToast" style="display: none;">
        <span class="wa-toast-icon">📲</span>
        <span class="wa-toast-msg" id="waToastMsg">Mandi Slip WhatsApp par bhej di hai</span>
        <a id="waToastLink" href="#" target="_blank" rel="noopener noreferrer" class="wa-toast-btn">Open</a>
      </div>
    </main>

    <!-- Bottom Dock: Clean & Minimalist (Screenshot 5 Match) -->
    <footer class="bottom-dock" id="voiceDock">
      <div class="dock-row">
        <!-- Left: Keyboard toggle for typing custom question directly (no pre-feeded chips) -->
        <button id="toggleKeyboardBtn" class="dock-side-btn" title="Type Question" aria-label="Type Question">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="4"/>
            <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/>
          </svg>
        </button>

        <!-- Center: Vibrant Neon Lime Mic with Soundwave Ripple Rings & Clear Toggle State -->
        <div class="mic-cluster" id="micCluster">
          <div class="acoustic-ripple-ring ring-3" id="rippleRing3"></div>
          <div class="acoustic-ripple-ring ring-2" id="rippleRing2"></div>
          <div class="acoustic-ripple-ring ring-1" id="rippleRing1"></div>
          <button id="mainMicBtn" class="dock-mic-neon active" title="Tap to pause / speak" aria-label="Microphone">
            <span id="micIconHolder">
              <svg class="mic-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </span>
          </button>
        </div>

        <!-- Right: Stop playback / Pause mic -->
        <button id="resetCallBtn" class="dock-side-btn" title="Stop &amp; Mute" aria-label="Stop &amp; Mute">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Pure Text Input Drawer (NO pre-feeded chips; farmer types their own question) -->
      <div class="custom-input-drawer" id="customInputDrawer" style="display: none;">
        <form id="customTextForm" class="custom-text-box">
          <input 
            type="text" 
            id="customTextInput" 
            placeholder="Type any crop or mandi question in Hindi or English..." 
            autocomplete="off"
          >
          <button type="submit" id="sendTextBtn" class="btn-send-text" aria-label="Send question">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </footer>
  </div>

  <!-- ONBOARDING MODAL: Sleek dark neon mobile number setup -->
  <div class="mobile-entry-overlay" id="mobileEntryOverlay">
    <div class="mobile-entry-sheet" id="mobileEntrySheet">
      <div class="sheet-pill">
        <span>AI Buddy • Kisan-Vaani</span>
      </div>
      <h2 class="sheet-heading">Start Voice Mode</h2>
      <p class="sheet-desc">Enter your phone number for personal live mandi intelligence &amp; WhatsApp slips.</p>

      <form id="mobileEntryForm" class="phone-form">
        <div class="input-phone-box">
          <span class="flag-prefix">🇮🇳 +91</span>
          <input 
            type="tel" 
            id="farmerPhoneInput" 
            placeholder="9876543210" 
            pattern="[0-9]{10}" 
            maxlength="10" 
            required 
            inputmode="numeric"
            autofocus
          >
        </div>
        <button type="submit" id="startVoiceAssistantBtn" class="btn-neon-start">
          Connect Voice Bot
        </button>
      </form>
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
